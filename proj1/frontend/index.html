<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Expense Tracker</title>
</head>

<body>

    <!-- LOGIN & REGISTER SECTION -->
    <section>
        <h2>Login / Register</h2>
        <form>
            <div>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
            </div>
            <br>
            <div>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <br>
            <div>
                <button type="button" id="login-btn">Login</button>
                <button type="button" id="register-btn">Register</button>
            </div>
        </form>
    </section>

    <!-- PARAGRAPH -->
    <p id="message"></p>

    <hr>

    <!-- EXPENSES SECTION -->
    <section>
        <h2>Expenses</h2>
        <form>
            <div>
                <label for="description">Description:</label>
                <input type="text" id="description" name="description" required>
            </div>
            <br>
            <div>
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" step="0.01" required>
            </div>
            <br>
            <div>
                <button type="button" id="add-btn">Add</button>
                <button type="button" id="refresh-btn">Refresh</button>
                <button type="submit" formaction="/logout" formmethod="POST">Logout</button>
            </div>
        </form>

        <h3>Expense List</h3>
        <ul id="expense-list">
            <!-- List items will be rendered here by the server -->
            <li>Example Item - $10.00</li>
        </ul>
    </section>

    <script>
        // TO-DO1: Refactor the API BASE
        const API_BASE = "http://localhost:3000/api";
        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            console.log(username, password);

            // first establish the url
            const REG = `${API_BASE}/auth/register`;

            try {
                const response = await fetch(REG, {
                    // build the request here
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        "username": username,
                        "password": password
                    }),
                    mode: "cors"
                })
                if (!response.ok) {
                    throw new Error(`Server responded: ${response.status}`)
                }
                console.log(response)
                const data = await response.text()
                console.log(data)

            } catch (err) {
                console.error("Error caught: ", err)
            }
        }

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            console.log("LOGGIN IN NIBBA")
            console.log(username, password);

            // first establish the url
            const LOGIN = `${API_BASE}/auth/login`;

            try {
                const response = await fetch(LOGIN, {
                    // build the request here
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        "username": username,
                        "password": password
                    }),
                    mode: "cors"
                })
                // here i need to see what is the response
                if (!response.ok) {
                    throw new Error(`Server responded: ${response.status}`)
                }
                const data = await response.json()
                localStorage.setItem('token', data["token"])
            } catch (err) {
                console.error("Error caught: ", err)
            }
        }

        async function refresh() {
            // this function refreshes the list by pulling and getting all expenses
            // first check if authenticated - try-catch block, then make a SELECT ALL request 
            const EXP = `${API_BASE}/expenses`;
            // grab the unordered list and empty it 
            const list = document.querySelector('expense-list');
            list.innerHTML = '';

            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    throw new Error("Please log in!")
                }
                const response = await fetch(EXP, {
                    method: "GET",
                    headers: {
                        'Content-Type': "application/json",
                        'Authorization': `Bearer: ${token}`
                    }
                });
                if (!response.ok) {
                    throw new Error(`Server responded: ${response.status}`)
                }
                const data = await response.json()
                console.log(data)

                // for every expense in data, create a new element as a li object, then append it to the inner list accoridingly \
                for (const i of data) {
                    const newI = document.createElement("li");
                    console.log(i);
                }
            } catch (err) {
                console.error("New error caught", err);
            }
        }

        async function add() {
            // check if secret token exists
            // if it doesnt, return error and say please log in
            // if it does, do some field checking
            // if the description not string, return error
            // if the amount not float return error, must be postive amount
            // if all fields are correct then add to database
            // how? call the expense.js route, call the insert route, add an expense
            const des = document.getElementById("description").value;
            const amt = document.getElementById("amount").value;
            try {
                const token = localStorage.getItem('token');
                if (!token) {
                    throw new Error("Please log in!")
                }
                // then i need to send it to the back to do the validation check 
                const EXP = `${API_BASE}/expenses`;
                const response = await fetch(EXP, {
                    method: "POST",
                    headers: {
                        'Content-Type': 'application/json',
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({
                        "description": des,
                        "amount": amt
                    })
                })
                if (!response.ok) {
                    throw new Error(`Server responded: ${response.status}`)
                }
                console.log(response)
                const data = await response.text()
                console.log(data)

                console.log(token);
            } catch (err) {
                console.error("Error caught: ", err)
            }
        }

        const reg = document.getElementById("register-btn");
        reg.onclick = function () {
            register();
        };
        const l = document.getElementById("login-btn");
        l.onclick = function () {
            login();
        };

        const a = document.getElementById("add-btn");
        a.onclick = function () {
            add();
        };
        const refr = document.getElementById("refresh-btn");
        refr.onclick = function () {
            refresh();
        }
    </script>

</body>

</html>
